<app-modal-improve-transfer />
<!--Modal End-->
<!--//////////-->
<!--Pop Up Start-->
<app-pop-up-qr/>
<!--Pop Up End-->
<!--Page Container Start-->
<main class="bg-white w-full min-h-screen flex flex-col lg:flex-row lg:flex-nowrap">
    <!--//////////-->
    <!--Image Block Start-->
    <section class="relative bg-cover bg-center w-full lg:max-w-[632px] min-h-[208px] lg:min-h-screen px-5 py-7 lg:rounded-br-[100px] bg-overlay-color bg-bg-image-04">
        <!--//////////-->
        <!--Image Block Container Inner Start-->
        <div class="relative z-20 flex flex-col items-center lg:items-start justify-between h-full px-0 pb-7 lg:pb-20 lg:pl-[120px] min-h-[208px]">
            <div class="w-full items-center lg:items-start flex flex-col gap-8">
                <!--Logo-->
                <div class="w-full max-w-60 h-[60px] lg:h-40 bg-bg-image-logo bg-no-repeat bg-contain bg-center"></div>
                <!--Greetings title-->
                <span class="hidden lg:inline-flex items-end flex-wrap text-text-greetings-02 text-[20px] font-light gap-1.5 h-[36px]">
                    <span class="inline-flex h-[36px] leading-normal pt-[4px]">{{ "steper_welcome" | translate }}</span>
                    <span class="inline-flex text-[24px] font-bold leading-normal h-[36px]">
                    {{userName()}}
                    </span>
                </span>
            </div>

            <!--Stepper Component Start-->
            <app-stepper [currentStep]="3"></app-stepper>
            <!--Stepper Component End-->
            <!--//////////-->
            <!--Button Select Language Start-->
            <div class="hidden lg:flex w-full max-w-[270px] relative mt-10 mb-10">
                <app-language-select
                [buttonClasses]="
                    'w-fit bg-transparent focus:ring-0 focus:outline-none focus:ring-transparent rounded-none px-0 py-0 inline-flex items-center text-center font-semibold text-[16px] leading-[16px] text-text-language-button-01 hover:text-opacity-80'
                "
                />
            </div>
            <!--Button Select Language End-->
            <!--//////////-->
        </div>
        <!--Image Block Container Inner End-->
        <!--//////////-->
    </section>
    <!--Image Block End-->
    <!--//////////-->
    <!--Add Contact Block Start-->
    <section class="z-20 w-full px-5 py-16 lg:px-10 flex justify-center items-center h-fit lg:min-h-screen">
        <!--//////////-->
        <!-- Contact Center Button Start -->
        <app-contact-center-button/>
        <!-- Contact Center Button End -->
        <!--//////////-->
        <!--Container Inner Start-->
        <div class="w-full max-w-[566px] flex flex-col gap-[30px]">
            <!--//////////-->
            <!--Container Group Texts Start-->
            <div class="flex flex-col pt-0 lg:pt-5 gap-5">
                <!--Title-->
                <h3 class="text-center text-[30px] font-bold leading-tight text-text-title">
                    {{ "reservation_detail_title" | translate }}
                </h3>
                <!--Paragraph-->
                <p class="text-text-paragraph-01 text-base font-normal leading-normal">
                    {{ "reservation_detail_subtitle" | translate }}
                </p>
                <!--Card Details Arrival Flight Start-->
                <app-card-detail-flight
                    [dataFlight]="arrivalData"
                    [dateFlight]="monthArrivalStringComputed()"
                    [hourFlight]="hourArrival()"
                ></app-card-detail-flight>
                <!--Card Details Arrival Flight End-->
                <!--//////////-->
                <!--Improve Service Start-->
                <div class="min-[550px]:h-[104px] lg:h-[67px] py-[10px] px-[41px] border border-primary bg-color-time-button rounded-[10px] flex justify-center">

                    
                    <div class="flex flex-col lg:flex-row lg:flex-nowrap lg:justify-center items-center gap-[12px] lg:gap-[26px]">

                        <div class="relative min-h-[30px] max-h-[30px] min-w-[30px] max-w-[30px] bg-primary rounded-full flex justify-center items-center overflow-hidden">
                            <div class="icon-wrapper">
                                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="20" viewBox="0 0 15 20" fill="none">
                                    <path d="M14.6375 6.84925L9.26251 1.48675C8.79411 1.02112 8.16048 0.759766 7.50001 0.759766C6.83955 0.759766 6.20592 1.02112 5.73751 1.48675L0.362514 6.84925C0.1297 7.08345 -0.000976562 7.40027 -0.000976562 7.7305C-0.000976562 8.06073 0.1297 8.37754 0.362514 8.61175C0.478718 8.72891 0.616969 8.8219 0.769293 8.88536C0.921617 8.94882 1.085 8.9815 1.25001 8.9815C1.41503 8.9815 1.57841 8.94882 1.73074 8.88536C1.88306 8.8219 2.02131 8.72891 2.13751 8.61175L6.25001 4.49925V18.2492C6.25001 18.5808 6.38171 18.8987 6.61613 19.1331C6.85055 19.3676 7.16849 19.4992 7.50001 19.4992C7.83153 19.4992 8.14948 19.3676 8.3839 19.1331C8.61832 18.8987 8.75001 18.5808 8.75001 18.2492V4.49925L12.8625 8.61175C13.0962 8.84713 13.4139 8.98002 13.7456 8.98119C14.0773 8.98237 14.3959 8.85172 14.6313 8.618C14.8666 8.38428 14.9995 8.06662 15.0007 7.73492C15.0019 7.40321 14.8712 7.08463 14.6375 6.84925Z" fill="white"/>
                                </svg>
                            </div>
                        </div>

                        <div class="flex flex-col items-center">
                            <span class="text-primary text-center text-[15px] font-bold leading-normal">
                                {{ "reservation_detail_middle_card_title" | translate }} 
                            </span>
                            <span class="text-center text-text-paragraph-01 text-[15px] font-normal leading-normal">
                                {{ "reservation_detail_middle_card_subtitle" | translate }}
                            </span>
                        </div>

                    </div>

                </div>
                <!--Improve Service End-->
                <!--//////////-->
                <!--Card Details Departure Flight Start-->
                <app-card-detail-flight
                    [dataFlight]="departureData"
                    [isArrivalFlight]="false"
                    [dateFlight]="monthDepartureStringComputed()"
                    [hourFlight]="hourDeparture()"
                ></app-card-detail-flight>
                <!--Card Details Departure Flight End-->
                <!--//////////-->
                <!--Main Button Start-->
                <button
                    (click)="openModal()"
                    id="open-modal-improve-transfer"
                    data-modal-target="modal-improve-transfer"
                    data-modal-toggle="modal-improve-transfer"
                    type="button"
                    class="mx-auto w-full max-w-full font-medium rounded-[5px] text-base px-5 py-2.5 text-text-primary-button bg-gradient-to-r from-tertiary via-primary to-secondary bg-opacity-100 hover:opacity-90  focus:ring-4 focus:ring-primary focus:ring-opacity-30"
                >
                    {{ "reservation_detail_button_label" | translate }}
                </button>
                <!--Main Button End-->
            <!--//////////-->
            </div>
            <!--Container Group Texts End-->
        
        </div>
        <!--Container Inner End-->
        <!--//////////-->
    </section>
    <!--Add Contact Block End-->
    <!--//////////-->
</main>
<!--Page Container End-->
<!--//////////-->
