<div
  id="modal-improve-transfer"
  tabindex="-1"
  aria-hidden="true"
  class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%)] max-h-full bg-black/25 backdrop-blur-md font-type-default"
>
  <div
    class="relative p-[30px] w-full bg-white rounded-[15px] shadow-sm max-w-[354px] lg:max-w-[450px]"
  >
    <div class="w-full flex justify-end items-center">
      <button
        (click)="onCloseModal()"
        type="button"
        class="min-h-8 max-h-8 min-w-8 max-w-8 text-white bg-transparent hover:bg-gray-100 bg-opacity-100 hover:bg-opacity-90 rounded-[5px] text-sm inline-flex justify-center items-center"
        data-modal-hide="modal-improve-transfer"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 12 12"
          class="w-3 h-3"
        >
          <path
            class="fill-black"
            d="M10.99 9.16293C11.5188 9.69394 11.5188 10.5522 10.99 11.0833C10.7262 11.3481 10.38 11.4812 10.0338 11.4812C9.68757 11.4812 9.34134 11.3481 9.07762 11.0833L5.97648 7.96918L2.87535 11.0833C2.61163 11.3481 2.2654 11.4812 1.91918 11.4812C1.57296 11.4812 1.22673 11.3481 0.963008 11.0833C0.434206 10.5522 0.434206 9.69394 0.963008 9.16293L4.06414 6.04886L0.963008 2.93479C0.434206 2.40378 0.434206 1.54548 0.963008 1.01447C1.49181 0.483459 2.34655 0.483459 2.87535 1.01447L5.97648 4.12854L9.07762 1.01447C9.60642 0.483459 10.4612 0.483459 10.99 1.01447C11.5188 1.54548 11.5188 2.40378 10.99 2.93479L7.88883 6.04886L10.99 9.16293Z"
          />
        </svg>
        <span class="sr-only">Close modal</span>
      </button>
    </div>
    <div class="bg-transparent w-full">
      <div
        class="w-full h-[120px] bg-bg-image-graphic-element-03 bg-contain bg-no-repeat bg-center mb-[25px]"
      ></div>
      <span
        class="inline-block font-bold leading-tight text-text-paragraph-01 text-[18px] text-center mb-[15px]"
      >
        <span class="inline-block text-primary">{{
          "modal_all_set_title_orange" | translate
        }}</span>
        {{ "modal_all_set_title" | translate }}
      </span>
      <p
        class="text-text-paragraph-01 text-center text-[15px] font-normal leading-normal mb-[35px]"
      >
        {{ "modal_all_set_text" | translate }}
      </p>
    </div>
    <div class="flex justify-center flex-nowrap gap-2.5">
      <button
        (click)="onCloseModal()"
        data-modal-hide="modal-improve-transfer"
        type="button"
        class="w-full max-w-[142px] lg:max-w-[190px] font-semibold hover:font-medium rounded-[5px] text-base px-2.5 py-2.5 text-text-secondary-button hover:text-text-primary-button bg-transparent border border-primary hover:border-transparent hover:bg-gradient-to-r hover:from-tertiary hover:via-primary hover:to-secondary focus:ring-4 focus:ring-primary focus:ring-opacity-30"
      >
        {{ "modal_all_set_button_wait" | translate }}
      </button>
      @if(isMobileDevice()){
      <a
        [attr.href]="'tel:' + phoneCall()"
        type="button"
        class="w-full max-w-[142px] lg:max-w-[190px] rounded-[5px] text-base px-2.5 py-2.5 text-text-primary-button bg-gradient-to-r from-tertiary via-primary to-secondary bg-opacity-100 hover:opacity-90 focus:ring-4 focus:ring-primary focus:ring-opacity-30"
      >
        {{ "modal_all_set_button_call" | translate }}
      </a>
      } @else {
      <button
        (click)="openAssistanceMenu()"
        type="button"
        class="w-full max-w-[142px] lg:max-w-[190px] rounded-[5px] text-base px-2.5 py-2.5 text-text-primary-button bg-gradient-to-r from-tertiary via-primary to-secondary bg-opacity-100 hover:opacity-90 focus:ring-4 focus:ring-primary focus:ring-opacity-30"
      >
        {{ "modal_all_set_button_call" | translate }}
      </button>

      }
    </div>
  </div>
</div>
