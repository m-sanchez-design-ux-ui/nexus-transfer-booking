<!-- stepper.component.html -->
<div
  class="flex w-fit h-fit lg:w-[270px] lg:h-fit lg:flex-col flex-row items-center gap-2 lg:gap-[45px]"
>
  <ng-container *ngFor="let step of steps(); let i = index">
    <div
      class="w-[85px] min-[400px]:w-28 lg:w-full flex items-center lg:items-center flex-col lg:flex-row gap-1.5 lg:gap-[14px] relative my-1"
    >
      <!-- Connector Line Desktop -->
      <div
        *ngIf="i > 0"
        class="lg:absolute lg:-top-[52px] lg:left-[15.5px] lg:h-[50px] lg:w-[3px] lg:block hidden bg-gray-stepper rounded"
        [ngClass]="{ 'bg-success-stepper': i <= currentStep() }"
      ></div>

      <!-- Connector Line Mobile -->
      <div
        *ngIf="i > 0"
        class="lg:hidden h-[3px] w-[34px] min-[400px]:w-[54px] bg-gray-stepper rounded absolute top-[17px] left-[-21.5px] min-[400px]:left-[-31.5px]"
        [ngClass]="{ 'bg-success-stepper': i <= currentStep() }"
      ></div>

      <!-- Icon + Status -->
      <div
        class="rounded-full h-stepper-circle-height w-stepper-circle-width flex items-center justify-center"
        [ngClass]="{
          'bg-primary-stepper text-white': currentStep() === i,
          'bg-success-stepper text-white': currentStep() > i,
          'border border-gray-stepper text-gray-stepper': currentStep() < i

      <!-- Label -->
      <div class="flex flex-col">
        <span
          class="relative top-1.5 text-[12px] font-normal hidden lg:block uppercase font-DM_Sans"
          [ngClass]="{
                'text-white': currentStep() === i || currentStep() > i,
                'text-gray-stepper': currentStep() < i,
            }"
          >{{ "stepper_step_0" + (i + 1) + "_label" | translate }}</span
        >
        <div
          class="lg:relative lg:bottom-[2px] text-[11px] lg:text-[24px] font-medium lg:font-bold whitespace-nowrap font-DM_Sans"
          [ngClass]="{
            'text-white': currentStep() === i || currentStep() > i,
            'text-gray-stepper': currentStep() < i
          }"
        >
          <ng-container *ngIf="i === 2; else defaultLabel">
            <span class="hidden lg:inline">{{
              "stepper_step_03_desktop_title" | translate
            }}</span>
            <span class="inline lg:hidden">{{
              "stepper_step_03_mobile_title" | translate
            }}</span>
          </ng-container>
          <ng-template #defaultLabel>
            {{ step.label }}
          </ng-template>
        </div>
