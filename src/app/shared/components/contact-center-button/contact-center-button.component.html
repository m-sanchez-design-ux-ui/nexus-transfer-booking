<div
  class="absolute right-[15px] min-[400px]:right-[20px] top-[35px] sm:right-[35px] lg:right-[40px] lg:top-[80px]"
>
  <!-- Button menu -->
  <button
    aria-label="contact button"
    id="dropdownContactCenterButton"
    data-dropdown-toggle="dropdownContactCenter"
    data-dropdown-offset-skidding="50"
    data-dropdown-offset-distance="8"
    class="focus:ring-4 focus:outline-none focus:ring-gray-100 lg:focus:ring-gray-200 font-medium text-sm text-center flex flex-col justify-center items-center lg:flex-row lg:flex-nowrap gap-[4.5px] lg:gap-1.5 appearance-none bg-transparent hover:bg-black lg:hover:bg-gray-100 hover:bg-opacity-75 lg:hover:bg-opacity-100 border-none m-0 hover:cursor-pointer p-2 rounded-[5px] w-fit min-[400px]:w-8 h-fit lg:w-fit lg:h-8"
    type="button"
  >
    <span
      class="size-[5px] lg:size-2 rounded-full bg-white lg:bg-icon-chat-button group-hover:bg-opacity-90"
    ></span>
    <span
      class="size-[5px] lg:size-2 rounded-full bg-white lg:bg-icon-chat-button group-hover:bg-opacity-90"
    ></span>
    <span
      class="size-[5px] lg:size-2 rounded-full bg-white lg:bg-icon-chat-button group-hover:bg-opacity-90"
    ></span>
  </button>

  <!-- Dropdown menu -->
  <div
    id="dropdownContactCenter"
    class="!transform-none !absolute !left-[-221px] min-[400px]:!left-[-211px] sm:!left-[-211px] lg:!left-[-191px] !top-12 lg:!top-10 z-10 hidden bg-white shadow-sm w-[247px] border-solid border border-gray-borders rounded-[10px]"
  >
    <ul class="py-2" aria-labelledby="dropdownContactCenterButton">
      <li
        class="text-text-paragraph-01 font-sans text-base font-semibold leading-none px-6 py-2 mb-2"
      >
        <span>{{ "contact_select_label" | translate }}</span>
      </li>
