    </div>

  </div>
  <!--Card Header End-->
  <!--//////////-->
  <!--Divisor Start-->
  <hr class="border-gray-borders" />
  <!--Divisor End-->
  <!--//////////-->
  <!--Card Footer Start-->
  <div
    class="w-full min-h-[22px] flex flex-row flex-wrap justify-between items-center gap-3"
  >
    <span class="text-base font-medium leading-none text-text-flight-airport"
      >#{{ flight.flightNumber }}</span
    >
    <button (click)="onselectFlight(flight)">
      <span
        class="text-primary text-base font-semibold leading-none tracking-wide"
      >
        {{ "modal_result_button_select" | translate }}
      </span>
    </button>
  </div>
  <!--Card Footer End-->
</div>

<!--Card Result End-->
