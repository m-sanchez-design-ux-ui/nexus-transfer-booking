<div
  #dropdownWrapper
  class="airline-select-wrapper relative w-ful font-type-default"
>
  <span 
    class="block mb-3 text-sm text-center text-text-label-01"
    [class]="CustomLabelClasses"
    [ngClass]="isAirlineSelected ? '' : '!text-red-600'"
  >
    {{ "airline_select_label" | translate }}
  </span>

  <div
    class="border-b-0 border-gray-200 py-1 flex items-center justify-between cursor-pointer"
    (click)="toggleDropdown()"
    (keydown)="toggleDropdown()"
  >
    <span
      class="w-[calc(100%-13px)] text-center text-text-input-03 text-[24px] font-bold leading-none"
      [class]="CustomPlaceholderTextClasses"
    >
      {{ selected?.name || ('airline_select_text' | translate) }}
    </span>

    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 13 11"
      class="fill-none w-[13px] h-[11px] transition-transform"
      [class.rotate-180]="isOpen()"
    >
      <path
        d="M6.5 10.5L0.870833 0.750001L12.1292 0.75L6.5 10.5Z"
        class="fill-primary"
        fill-rule="evenodd"
        clip-rule="evenodd"
      />
    </svg>
  </div>

  <div
    *ngIf="isOpen()"
    class="absolute z-50 w-full rounded-2xl border border-gray-100 bg-white shadow-lg p-7"
    [ngClass]="{
      'mt-2 top-full': dropdownDirection() === 'down',
      'mb-2 bottom-full': dropdownDirection() === 'up'
    }"
  >
    <!-- Search -->
    <div class="relative flex flex-col mb-5">
      <span
        class="absolute inset-y-0 left-2 flex items-center pointer-events-none text-text-input-search"
      >
        <svg
          class="w-5 h-5"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M21 21l-4.35-4.35m0 0a7.5 7.5 0 10-10.61 0 7.5 7.5 0 0010.61 0z"
          />
        </svg>
      </span>
      <input
        type="text"
        [placeholder]="airlinePlaceholder()"
        class="pl-10 pr-3.5 py-2 rounded-none font-medium text-[18px] border-0 text-text-input-search placeholder-text-placeholder"
        [value]="searchTerm()"
        (input)="searchTerm.set($any($event.target).value)"
      />
      <button
        *ngIf="searchTerm()"
        class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-icon-x hover:text-gray-icon-x-hover"
        (click)="clearSelection(); $event.stopPropagation()"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="w-5 h-5"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M6 18L18 6M6 6l12 12"
          />
        </svg>
      </button>
    </div>

    <!-- Results -->
    <ul class="max-h-60 overflow-y-auto" (scroll)="onScroll($event)">
      @for(airline of filteredAirlines(); track $index){
      <li
        class="flex items-center pl-2 pr-0 py-0 cursor-pointer hover:bg-gray-100 text-[14px] font-medium leading-none first:border-t first:border-t-gray-borders border-solid border-b border-b-gray-borders text-text-input-list"
        (click)="selectAirline(airline)"
        (keydown)="selectAirline(airline)"
      >

            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"

          </svg>

          {{ airline.name }} ({{ airline.id }})
        </span>
      </li>

      }
    </ul>
  </div>
</div>
