<main
  class="bg-white w-full min-h-screen flex flex-col lg:flex-row lg:flex-nowrap"
>
  <section
    class="relative bg-cover bg-center w-full lg:max-w-[632px] min-h-[208px] lg:min-h-screen px-5 py-7 lg:py-20 lg:rounded-br-[100px] bg-overlay-color"
    [ngClass]="backgroundClass()"
  >
    <div [ngClass]="getRightSideClass()">
      <div
        class="w-full max-w-60 h-[60px] lg:h-40 bg-bg-image-logo bg-no-repeat bg-contain bg-center"
      ></div>

      @if(!isReservationPage()){
      <app-stepper [currentStep]="step()"></app-stepper>
      <div
        class="hidden lg:flex lg:justify-start w-full max-w-[270px] relative pt-[80px]"
      >
        <app-language-select
          [buttonClasses]="
            'w-fit bg-transparent focus:ring-0 focus:outline-none focus:ring-transparent rounded-none px-0 py-0 inline-flex items-center text-center font-semibold text-[16px] leading-[16px] text-text-language-button-01 hover:text-opacity-80'
          "
        />
      </div>
      } @else{
      <div
        class="hidden lg:block h-48 w-full bg-bg-image-graphic-element-01 bg-contain bg-center bg-no-repeat"
      ></div>

      <div
        class="w-full max-w-[434px] flex flex-nowrap gap-[25px] h-[62px] lg:h-[84px] bg-bg-image-logos-group-mobile lg:bg-bg-image-logos-group-desktop bg-contain bg-center bg-no-repeat"
      ></div>
      }
    </div>
  </section>

  <section [ngClass]="getContentSectionClass()">
    @if(this.activatedRoute.routeConfig?.title !== "Reservation"){
    <app-contact-center-button />
    }
    <div class="w-full flex flex-col" [ngClass]="getStyle()">
      <ng-content select="[layout-content]"></ng-content>
    </div>
  </section>
</main>
