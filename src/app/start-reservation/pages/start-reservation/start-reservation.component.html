<!--//////////-->
<!--Alert Reservation Not Found Start-->
<app-alert-reservation [message]="messageModal()" [messageText]="messageModalText()" />

<main-layout [backgroundClass]="'bg-bg-image-01'" [isReservationPage]="true">
  <ng-content layout-content>
    <h2
      class="text-center text-[30px] lg:text-[40px] font-bold leading-none tracking-[-0.5px] text-text-title"
    >
      {{ "start_reservation_title" | translate }}
    </h2>

    <p
      class="text-center text-[16px] font-normal leading-normal text-paragraph-01"
    >
      {{ "start_reservation_paragraph" | translate }}
    </p>

    <div
      class="rounded-[20px] border border-[#D6D6D6] bg-white h-[81px] w-full max-w-[300px] mx-auto p-[15px]"
    >
      <label
        for="reservation"
        class="font-medium text-[14px] leading-normal flex justify-center h-[18px] text-text-label-01"
      >
        {{ "start_reservation_label" | translate }}
      </label>
      <input
        [(ngModel)]="codeReservation"
        type="text"
        id="reservation"
        [placeholder]="'start_reservation_placeholder_example' | translate"
        class="w-full text-center border-0 p-0 mt-[11px] text-[26px] font-bold leading-[22px] text-text-input-01 h-[28px] placeholder:text-text-placeholder overflow-y-visible overflow-x-hidden"
      />
    </div>

    <button
      (click)="goToArrivalFlight()"
      id="goToArrivalFlight"
      type="button"
      class="mx-auto w-full max-w-[300px] font-medium rounded-[5px] text-base px-5 py-2.5 text-text-primary-button bg-gradient-to-r from-tertiary via-primary to-secondary bg-opacity-100 hover:opacity-90 focus:ring-4 focus:ring-primary focus:ring-opacity-30"
    >
      {{ "start_reservation_main_button" | translate }}
    </button>

    <!-- NOTE (demo fork): reminder that this is a mocked booking lookup. -->
    <p class="text-xs text-gray-400 text-center">
      {{ "demo_hint_start_reservation" | translate }}
    </p>

    <app-language-select [buttonClasses]="'w-fit mx-auto bg-transparent hover:bg-gray-100 focus:ring-4 focus:outline-none focus:ring-gray-200 rounded-[5px] px-5 py-2.5 inline-flex items-center text-center font-semibold text-[16px] leading-[16px] text-text-language-button-02'"/>
